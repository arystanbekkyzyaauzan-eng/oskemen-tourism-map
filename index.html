<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Өскеменнің жасырын туристік орындары</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #263238;
    }

    header {
      background: linear-gradient(135deg, #355c4a, #668b72);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    .controls {
      padding: 15px;
      text-align: center;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      border: none;
      padding: 10px 16px;
      margin: 4px;
      border-radius: 20px;
      cursor: pointer;
      background: #e8eee9;
      color: #274536;
      font-size: 14px;
    }

    button:hover {
      background: #cbdccf;
    }

    button.active {
      background: #355c4a;
      color: white;
    }

    #map {
      width: 100%;
      height: 650px;
    }

    .red-marker {
      background: #d62828;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 3px solid white;
      box-shadow: 0 2px 7px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .red-marker span {
      transform: rotate(45deg);
    }

    .leaflet-tooltip {
      font-weight: bold;
      font-size: 13px;
      padding: 6px 9px;
      border-radius: 8px;
    }

    .popup-title {
      font-size: 17px;
      font-weight: bold;
      color: #355c4a;
      margin-bottom: 7px;
    }

    .popup-category {
      display: inline-block;
      background: #e8eee9;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .popup-text {
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #355c4a;
      color: white;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      #map {
        height: 550px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📍 Өскеменнің жасырын туристік орындары</h1>
  <p>Көпшілік біле бермейтін ерекше орындарды бірге зерттейік!</p>
</header>

<div class="controls">
  <button class="active" onclick="filterPlaces('all', this)">Барлығы</button>
  <button onclick="filterPlaces('nature', this)">🌿 Табиғат</button>
  <button onclick="filterPlaces('history', this)">🏛️ Тарих</button>
  <button onclick="filterPlaces('culture', this)">🏡 Мәдениет</button>
</div>

<div id="map"></div>

<footer>
  © 2026 «Менің қаламдағы жасырын туристік орындар» жобасы
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // Өскемен қаласының орталығы
  const map = L.map('map').setView([49.9483, 82.6279], 12);

  // OpenStreetMap картасы
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);


  // Жасырын туристік орындар
  // Координаттар жобалық картада шамамен көрсетілген.
  const places = [

    {
      id: 1,
      name: "Орёл тауы",
      category: "nature",
      icon: "⛰️",
      lat: 49.991,
      lng: 82.580,
      description: "Өскемен маңындағы табиғи көріністі тамашалауға болатын ерекше орын."
    },

    {
      id: 2,
      name: "Поганка — Комендантка",
      category: "history",
      icon: "🌿",
      lat: 49.944,
      lng: 82.600,
      description: "Қаланың тарихи өткенімен байланысты қызықты аумақ."
    },

    {
      id: 3,
      name: "Көпес Рафиковтың үйі",
      category: "history",
      icon: "🏛️",
      lat: 49.950,
      lng: 82.626,
      description: "Өскеменнің тарихи сәулетін танытатын көне ғимараттардың бірі."
    },

    {
      id: 4,
      name: "Ретро-музей",
      category: "history",
      icon: "🚗",
      lat: 49.964,
      lng: 82.604,
      description: "Өткен дәуірдегі көлік және тұрмыс мәдениетімен танысуға мүмкіндік беретін орын."
    },

    {
      id: 5,
      name: "Өскемен бекінісінің қорғаны",
      category: "history",
      icon: "🏰",
      lat: 49.948,
      lng: 82.622,
      description: "Қаланың тарихи қалыптасу кезеңін еске түсіретін орын."
    },

    {
      id: 6,
      name: "Аблакеткадағы байқау алаңы",
      category: "nature",
      icon: "⛰️",
      lat: 49.915,
      lng: 82.570,
      description: "Қаланы биіктен бақылауға және табиғатты тамашалауға болатын орын."
    },

    {
      id: 7,
      name: "Этноауыл",
      category: "culture",
      icon: "🏡",
      lat: 49.978,
      lng: 82.648,
      description: "Қазақ халқының дәстүрі мен ұлттық мәдениетін таныстыратын мәдени кеңістік."
    },

    {
      id: 8,
      name: "Стрелка",
      category: "nature",
      icon: "🌊",
      lat: 49.981,
      lng: 82.615,
      description: "Өскемендегі өзендер тоғысатын, серуендеуге қолайлы ерекше орын."
    },

    {
      id: 9,
      name: "Меновное көлі — Сол жағалау кешені",
      category: "nature",
      icon: "🌊",
      lat: 50.010,
      lng: 82.720,
      description: "Табиғат аясында демалып, қаланың сыртқы көрінісін тамашалауға болатын орын."
    },

    {
      id: 10,
      name: "Шешек тауы",
      category: "nature",
      icon: "⛰️",
      lat: 49.900,
      lng: 82.670,
      description: "Табиғи ландшафтымен ерекшеленетін, зерттеуге қызықты орын."
    }

  ];


  let markers = [];


  // Қызыл маркер жасау
  function createMarker(place, number) {

    const icon = L.divIcon({
      className: '',
      html: `
        <div class="red-marker">
          <span>${number}</span>
        </div>
      `,
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -34]
    });

    const marker = L.marker(
      [place.lat, place.lng],
      { icon: icon }
    );


    marker.bindTooltip(
      `${place.icon} ${place.name}`,
      {
        permanent: true,
        direction: 'top',
        offset: [0, -28]
      }
    );


    marker.bindPopup(`
      <div>
        <div class="popup-title">
          ${place.icon} ${place.name}
        </div>

        <div class="popup-category">
          ${getCategoryName(place.category)}
        </div>

        <div class="popup-text">
          ${place.description}
        </div>

        <br>

        <small>
          📍 Жобалық картадағы шамамен орналасуы
        </small>
      </div>
    `);

    return marker;
  }


  function getCategoryName(category) {

    if (category === "nature") {
      return "🌿 Табиғат";
    }

    if (category === "history") {
      return "🏛️ Тарих";
    }

    if (category === "culture") {
      return "🏡 Мәдениет";
    }

    return "Барлығы";
  }


  // Барлық маркерлерді көрсету
  function showPlaces(list) {

    markers.forEach(marker => {
      map.removeLayer(marker);
    });

    markers = [];

    list.forEach((place, index) => {

      const marker = createMarker(place, place.id);

      marker.addTo(map);

      markers.push(marker);

    });
  }


  // Категория бойынша сүзу
  function filterPlaces(category, button) {

    document.querySelectorAll("button").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");


    if (category === "all") {
      showPlaces(places);
    } else {

      const filtered = places.filter(
        place => place.category === category
      );

      showPlaces(filtered);
    }
  }


  // Алғашқыда 10 орынды көрсету
  showPlaces(places);

</script>

</body>
</html>
